apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: default
data:
  log-level: "INFO"
  max-connections: "100"
  timeout: "30"
  feature-flag: "disabled"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-app
  namespace: default
  labels:
    app: configmap-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configmap-demo
  template:
    metadata:
      labels:
        app: configmap-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          echo "Starting application..."
          echo "Log Level: $LOG_LEVEL"
          echo "Max Connections: $MAX_CONNECTIONS"
          echo "Timeout: $TIMEOUT"
          echo "Feature Flag: $FEATURE_FLAG"
          echo "Config file contents:"
          cat /etc/config/settings.conf
          sleep 3600
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: log-level
        - name: MAX_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: max-connections
        - name: TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: timeout
        - name: FEATURE_FLAG
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: feature-flag
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: config-volume
        configMap:
          name: app-settings
          items:
          - key: log-level
            path: settings.conf
