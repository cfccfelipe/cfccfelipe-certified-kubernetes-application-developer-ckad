apiVersion: v1
kind: Pod
metadata:
  name: secure-pod 
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
  volumes:
  - name: temporary 
  containers:
  - name: secure-pod
    image: nginx:1.21
    command: [ "sh", "-c", "tail -f /dev/null" ]
    volumeMounts:
    - name: temporary 
      mountPath: /tmp
    securityContext:
      readOnlyRootFilesystem: true 

