apiVersion: v1
kind: Pod
metadata:
  labels:
    run: noroot-pod
  name: noroot-pod
spec:
  volumes:
    - name: tmp-volume
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:

  - image: busybox
    securityContext:
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
    command: ["sh","-c", "sleep 3600"] 
    name: noroot-pod
    volumeMounts:
      - mountPath: /tmp
        name: tmp-volume
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
