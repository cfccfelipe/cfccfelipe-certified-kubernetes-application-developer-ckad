apiVersion: v1
kind: ServiceAccount
metadata:
  creationTimestamp: 2019-06-16T00:12:34Z
  name: build-robot
  namespace: practice
  resourceVersion: "272500"
  uid: 721ab723-13bc-11e5-aec2-42010af0021e
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:
  - image: nginx
    name: nginx
    command: ["sh", "-c"]
    args:
      - cat ./tokens/vault-token
    volumeMounts:
    - mountPath: /tokens
      name: vault-token
  serviceAccountName: build-robot
  volumes:
  - name: vault-token
    projected:
      sources:
      - serviceAccountToken:
          path: vault-token
          expirationSeconds: 7200
          audience: vault

