apiVersion: v1
data:
  app-config.properties: |
    database.url=jdbc:mysql://mysql:3306/mydb
    database.driver=com.mysql.jdbc.Driver
    cache.enabled=true
    cache.ttl=3600
kind: ConfigMap
metadata:
  name: app-config
---
apiVersion: v1
kind: Pod
metadata:
  name: config-pod
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
    command: [ "/bin/sh", "-c"]
    args: 
      - |
        echo "--- Contenido de /etc/config ---"
        ls -lha /etc/config/
        echo "--- Fin del listado ---"
        tail -f /dev/null
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
      readOnly: true
  volumes:
     - name: config-volume
       configMap:
          name: app-config
