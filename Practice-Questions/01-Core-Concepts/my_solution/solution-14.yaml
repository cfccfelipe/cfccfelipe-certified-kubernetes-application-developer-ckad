apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000
globalDefault: false
description: "This priority class should be used for XYZ service pods only."

---

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
value: 100
globalDefault: false
description: "This priority class should be used for XYZ service pods only."

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx-high
  labels:
    env: test
spec:
  containers:
  - name: nginx
    image: nginx
    command: ["sh","-c","date"]
    imagePullPolicy: IfNotPresent
  priorityClassName: high-priority

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx-low
  labels:
    env: test
spec:
  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: IfNotPresent
    command: ["sh","-c","date"]
  priorityClassName: low-priority
