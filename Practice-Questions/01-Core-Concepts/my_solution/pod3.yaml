apiVersion: v1
kind: Pod
metadata:
  labels:
    run: env-pod
  name: env-pod
spec:
  containers:
  - command:
    - DB_PORT=3306
    - APP_ENV=production
    - sleep
    - "3600"
    env:
    - name: DB_HOST
      value: mysql-service
    image: busybox:1.36
    name: env-pod
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
