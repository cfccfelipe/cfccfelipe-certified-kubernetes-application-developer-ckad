apiVersion: v1
kind: Pod
metadata:
  labels:
    run: env-pod
  name: env-pod
spec:
  containers:
  - env:
    - name: DB_HOST
      value: mysql-service
    - name: DB_PORT
      value: "3306"
    - name: APP_ENV
      value: production
    image: busybox:1.36
    name: env-pod
    resources: {}
    command: ["sh","-c","sleep 3600"]
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
