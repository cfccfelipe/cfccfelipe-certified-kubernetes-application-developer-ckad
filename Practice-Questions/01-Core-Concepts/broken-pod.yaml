apiVersion: v1
kind: Pod
metadata:
  name: broken-pod
  namespace: default
spec:
  containers:
  - name: web-container
    image: nginx:1.21
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "32Mi"  # BUG: Limit is less than request
        cpu: "500m"
  - name: sidecar-container
    image: busybox:1.36
    command: ["sh", "-c", "sleep 360"]
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
