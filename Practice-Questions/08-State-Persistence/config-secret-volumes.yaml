# ConfigMap with multiple files
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-files
  namespace: default
data:
  app.properties: |
    application.name=MyApp
    application.version=1.0.0
    server.port=8080
    server.host=0.0.0.0
  database.conf: |
    [database]
    type=postgresql
    max_connections=100
    timeout=30
  logging.yaml: |
    logging:
      level: INFO
      format: json
      output: /var/log/app.log
---
# Secret with credentials
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
stringData:
  username: admin
  password: SuperSecretPassword123!
  api-key: "1234567890abcdef"
  database-url: "postgresql://user:pass@db-host:5432/mydb"
---
# Pod mounting ConfigMap and Secret as volumes
apiVersion: v1
kind: Pod
metadata:
  name: config-secret-pod
  namespace: default
  labels:
    app: config-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      echo "=== Configuration Files ==="
      echo "Files in /etc/config:"
      ls -la /etc/config/
      echo ""
      echo "--- app.properties ---"
      cat /etc/config/app.properties
      echo ""
      echo "--- database.conf ---"
      cat /etc/config/database.conf
      echo ""
      echo "=== Secret Files ==="
      echo "Files in /etc/secrets:"
      ls -la /etc/secrets/
      echo ""
      echo "--- Username ---"
      cat /etc/secrets/username
      echo ""
      echo "Note: Password and API key are hidden for security"
      echo ""
      echo "Sleeping for 3600 seconds..."
      sleep 3600
    volumeMounts:
    # Mount ConfigMap
    - name: config-volume
      mountPath: /etc/config
      readOnly: true
    # Mount Secret
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"

  volumes:
  # ConfigMap volume
  - name: config-volume
    configMap:
      name: app-config-files
      # Optional: select specific files
      items:
      - key: app.properties
        path: app.properties
      - key: database.conf
        path: database.conf
      - key: logging.yaml
        path: logging.yaml

  # Secret volume with restricted permissions
  - name: secret-volume
    secret:
      secretName: app-secrets
      defaultMode: 0400  # Read-only for owner
      items:
      - key: username
        path: username
      - key: password
        path: password
      - key: api-key
        path: api-key
      - key: database-url
        path: db-url

  restartPolicy: Always
---
# Example Pod showing selective mounting of ConfigMap keys
apiVersion: v1
kind: Pod
metadata:
  name: selective-mount-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:1.21-alpine
    volumeMounts:
    # Mount only specific file from ConfigMap to specific path
    - name: app-config
      mountPath: /etc/nginx/conf.d/app.properties
      subPath: app.properties  # Mount only this file
      readOnly: true
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"

  volumes:
  - name: app-config
    configMap:
      name: app-config-files
