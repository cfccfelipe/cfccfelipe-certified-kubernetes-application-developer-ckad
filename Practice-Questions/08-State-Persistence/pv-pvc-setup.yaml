# PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-pv
  labels:
    type: local
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data
    type: DirectoryOrCreate
---
# PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: manual
---
# Pod using the PVC
apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo-pod
  namespace: default
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      echo "Writing to persistent volume..."
      echo "Data written at $(date)" >> /data/persistent.log
      echo "Persistent storage contents:"
      cat /data/persistent.log
      echo "Sleeping for 3600 seconds..."
      sleep 3600
    volumeMounts:
    - name: persistent-storage
      mountPath: /data
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: manual-pvc
  restartPolicy: Always
