apiVersion: v1
kind: Pod
metadata:
  name: multi-port-pod
  namespace: default
  labels:
    app: multi-port-app
spec:
  containers:
  # HTTP Server Container
  - name: web-server
    image: nginx:1.21-alpine
    ports:
    - name: http
      containerPort: 80
      protocol: TCP
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"

  # Metrics Server Container
  - name: metrics-server
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      while true; do
        echo -e "HTTP/1.1 200 OK\n\nmetrics_counter $(date +%s)" | nc -l -p 9090
      done
    ports:
    - name: metrics
      containerPort: 9090
      protocol: TCP
    resources:
      requests:
        memory: "16Mi"
        cpu: "25m"

  # Admin API Container
  - name: admin-api
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      while true; do
        echo -e "HTTP/1.1 200 OK\n\n{\"status\":\"healthy\",\"time\":\"$(date)\"}" | nc -l -p 8443
      done
    ports:
    - name: admin
      containerPort: 8443
      protocol: TCP
    resources:
      requests:
        memory: "16Mi"
        cpu: "25m"
---
# Multi-Port Service
apiVersion: v1
kind: Service
metadata:
  name: multi-port-service
  namespace: default
spec:
  selector:
    app: multi-port-app
  type: ClusterIP
  ports:
  # HTTP port
  - name: http
    protocol: TCP
    port: 80
    targetPort: http

  # Metrics port
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: metrics

  # Admin port (different service port than target port)
  - name: admin
    protocol: TCP
    port: 8080
    targetPort: admin
---
# NodePort Service variant (for external access)
apiVersion: v1
kind: Service
metadata:
  name: multi-port-nodeport
  namespace: default
spec:
  selector:
    app: multi-port-app
  type: NodePort
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
    nodePort: 30080

  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: metrics
    nodePort: 30090

  - name: admin
    protocol: TCP
    port: 8080
    targetPort: admin
    nodePort: 30443
