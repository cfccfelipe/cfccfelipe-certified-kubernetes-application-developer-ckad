apiVersion: v1
kind: Pod
metadata:
  labels:
    test: liveness
  name: probe-demo 
spec:
  containers:
  - name: liveness
    image: nginx:1.21
    args:
    - liveness
    - readiness
    readinessProbe:
      httpGet:
        port: 80
        path: /ready
      initialDelaySeconds: 5
      periodSeconds: 3
    livenessProbe:
      httpGet:
        path: /healthz
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3
---

apiVersion: v1
kind: Pod
metadata:
  labels:
    test: liveness
  name: probe-demo2 
spec:
  containers:
  - name: liveness
    image: nginx:1.21
    args:
    - sleep 
    - "2000" 
    readinessProbe:
      httpGet:
        port: 80
        path: /
      initialDelaySeconds: 5
      periodSeconds: 3
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3

