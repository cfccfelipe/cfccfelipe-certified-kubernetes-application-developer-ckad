apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
  - name: app 
    image: python:3.9-slim
    command: ["python", "-c"]
    # Este script crea una lista que consume ~250MB de RAM inmediatamente
    args: ["a = b' ' * 250000000; import time; time.sleep(600)"]
    resources:
      limits:
        memory: "256Mi"
        cpu: "250m"
