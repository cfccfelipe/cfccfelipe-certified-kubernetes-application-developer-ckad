apiVersion: v1
kind: Pod
metadata:
  name: aggressive-probe-test
spec:
  containers:
  - name: python-app
    image: python:3.11-slim
    # We use a shell to create the 20s startup lag
    command: ["/bin/sh", "-c"]
    restartPolicy: Never
    args:
      - |
        echo "Starting 20s warmup..."
        sleep 20
        echo "App is now running!"
        python3 -m http.server 8080
    ports:
    - containerPort: 8080
    
    # --- AGGRESSIVE LIVENESS PROBE ---
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      # If this is < 20, the probe will kill the pod before it starts
      initialDelaySeconds: 20 
      periodSeconds: 5
      failureThreshold: 2 # Very aggressive: 2 failures = Restart
