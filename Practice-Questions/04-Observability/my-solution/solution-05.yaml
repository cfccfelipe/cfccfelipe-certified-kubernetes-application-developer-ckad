apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo
data:
  settings.conf: |
    enemy.types=aliens,monsters
    player.maximum-lives=5    
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: debugger
  name: debug-pod
  namespace: practice
spec:
  hostAliases:
  - ip: "10.1.2.3"
    hostnames:
    - "mi-servidor-db.local"
  containers:
  - args:
    - |
      cat /etc/hosts
      touch /var/run/nginx.pid;
      cat $APP_CONFIG_PATH;
      nginx -g "daemon off;"
    command:
    - sh
    - -c
    env:
    - name: APP_CONFIG_PATH
      value: /etc/config/settings.conf
    - name: DB_HOST
      value: localhost
    image: nginx:alpine
    name: debug-container
    volumeMounts:
      - name: config
        mountPath: "/etc/config/"
        readOnly: true

  volumes:
    # You set volumes at the Pod level, then mount them into containers inside that Pod
      - name: config
        configMap:
        # Provide the name of the ConfigMap you want to mount.
          name: game-demo
