apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo
  namespace: default
  labels:
    app: probe-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe-demo
  template:
    metadata:
      labels:
        app: probe-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
          protocol: TCP
        # Liveness probe - checks if container is alive
        livenessProbe:
          httpGet:
            path: /healthz  # This path doesn't exist - will fail!
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        # Readiness probe - checks if container can serve traffic
        readinessProbe:
          httpGet:
            path: /ready  # This path doesn't exist - will fail!
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 3
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
